name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: sesautomatoracr.azurecr.io
  IMAGE_NAME: ses-automator-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.REGISTRY_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ./backend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Ensure single-revision mode
        run: |
          az containerapp revision mode set \
            --name ses-automator-api \
            --resource-group ses-automator-rg \
            --mode single

      - name: Deploy new revision
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          az containerapp update \
            --name ses-automator-api \
            --resource-group ses-automator-rg \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --min-replicas 1 \
            --revision-suffix $SHA_SHORT \
            --output table
