name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: sesautomatoracr.azurecr.io
  IMAGE_NAME: ses-automator-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.REGISTRY_NAME }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ./backend
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy new revision
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          SUBSCRIPTION=$(az account show --query id --output tsv)
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Switch to single-revision mode so the new revision gets 100% traffic automatically
          az rest \
            --method PATCH \
            --url "https://management.azure.com/subscriptions/$SUBSCRIPTION/resourceGroups/ses-automator-rg/providers/Microsoft.App/containerApps/ses-automator-env?api-version=2023-05-01" \
            --headers "Content-Type=application/json" \
            --body '{"properties":{"configuration":{"activeRevisionsMode":"Single"}}}'

          # Wait for the mode-switch provisioning to finish before updating the image
          echo "Waiting for provisioning to complete..."
          for i in $(seq 1 30); do
            STATE=$(az containerapp show \
              --name ses-automator-env \
              --resource-group ses-automator-rg \
              --query properties.provisioningState \
              --output tsv)
            echo "  state: $STATE"
            [ "$STATE" = "Succeeded" ] && break
            sleep 10
          done

          # Deploy new image — unique suffix forces a new revision; single mode activates it
          az containerapp update \
            --name ses-automator-env \
            --resource-group ses-automator-rg \
            --image $IMAGE \
            --min-replicas 1 \
            --revision-suffix $SHA_SHORT \
            --output table
